      <article class="intro">
        <h2>成都印象</h2>
        <p>成都，一座兼具古韵与时尚的活力之城。宽窄巷子诉说着老成都的故事，锦江两岸灯火映照着悠闲夜色。大熊猫憨态可掬，美食香气四溢，茶馆里终日洋溢着舒缓惬意。这里既有三千年不改的“少城”文脉，也有不断更新的潮流风景。漫步街头，品一碗热气腾腾的面，坐在绿荫下品一杯盖碗茶，便能读懂这座“蓉城”的浪漫与包容。</p>
